{% extends 'base.html' %}
{% block title %}Manual Entry — Sentinel{% endblock %}
{% block page_title %}Manual Transaction Entry{% endblock %}
{% block content %}
<div style="max-width:620px;">
  <div class="card">
    <div class="card-title">Transaction Details</div>
    <form method="POST">
      <div class="form-row">
        <div class="form-group"><label class="form-label">Date *</label><input name="date" type="date" class="form-control" required></div>
        <div class="form-group"><label class="form-label">Amount (KES) *</label><input name="amount" type="number" step="0.01" min="0" class="form-control" placeholder="0.00" required></div>
      </div>
      <div class="form-group"><label class="form-label">Payee / Vendor Name *</label><input name="payee" type="text" class="form-control" placeholder="Full legal name of payee" required></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Department</label><input name="department" type="text" class="form-control" placeholder="e.g. Finance"></div>
        <div class="form-group"><label class="form-label">Transaction Type</label>
          <select name="transaction_type" class="form-control"><option value="">Select type</option><option>Payment</option><option>Utility</option><option>Service</option><option>Salary</option><option>Refund</option><option>Transfer</option><option>Tax</option><option>Rent</option><option>Other</option></select>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Reference Number</label><input name="reference_no" type="text" class="form-control" placeholder="e.g. INV-2024-001"></div>
      <div class="form-group"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3" placeholder="Brief description of the transaction purpose"></textarea></div>
      <div class="flex-end"><a href="{{ url_for('transactions.list_all') }}" class="btn btn-ghost">Cancel</a><button type="submit" class="btn btn-primary">Save and Analyse</button></div>
    </form>
  </div>
</div>
{% endblock %}
