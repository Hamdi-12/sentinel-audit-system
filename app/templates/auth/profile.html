{% extends 'base.html' %}
{% block title %}Profile — Sentinel{% endblock %}
{% block page_title %}Account Settings{% endblock %}
{% block content %}
<div style="max-width:560px;">
  <div class="card">
    <div class="card-title">Profile Information</div>
    <form method="POST">
      <div class="form-row">
        <div class="form-group"><label class="form-label">Full Name</label><input name="full_name" type="text" class="form-control" value="{{ current_user.full_name or '' }}"></div>
        <div class="form-group"><label class="form-label">Username</label><input type="text" class="form-control" value="{{ current_user.username }}" disabled style="opacity:.5"></div>
      </div>
      <div class="form-group"><label class="form-label">Email</label><input name="email" type="email" class="form-control" value="{{ current_user.email }}"></div>
      <div class="form-group"><label class="form-label">Role</label><input type="text" class="form-control" value="{{ current_user.role.upper() }}" disabled style="opacity:.5"></div>
      <hr class="sep">
      <div class="card-title">Change Password <span style="font-weight:400;font-size:12px;color:var(--muted);">(leave blank to keep current)</span></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">New Password</label><input name="new_password" type="password" class="form-control" placeholder="Min. 8 characters"></div>
        <div class="form-group"><label class="form-label">Confirm</label><input name="new_password2" type="password" class="form-control" placeholder="Repeat password"></div>
      </div>
      <div class="flex-end"><button type="submit" class="btn btn-primary">Save Changes</button></div>
    </form>
  </div>
</div>
{% endblock %}
